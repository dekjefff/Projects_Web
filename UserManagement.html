<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Management</title>
    <link rel="stylesheet" href="/UserManagement/UserManagement.css">
</head>

<body>
    <div class="shell">
        <section class="hero" aria-label="Header">
            <h1>User Management</h1>
            <div class="sub">Comprehensive admin interface for managing your products and services</div>
        </section>
        <section class="stage">
            <div class="stage-inner">
                <div class="filters">
                    <input class="inp" type="text" placeholder="Search users by name, email or role..."
                        aria-label="Search" />
                    <select class="sel" aria-label="Status filter">
                        <option selected>All Status</option>
                    </select>
                    <select class="sel" aria-label="Role filter">
                        <option selected>All Roles</option>
                    </select>
                    <button class="btn btn-primary" type="button" id="AddUser">
                        <span class="plus">+</span> ADD User
                    </button>
                </div>

                <div class="table-card" role="region" aria-label="User list">
                    <table class="table" aria-describedby="table-desc">
                        <thead>
                            <tr>
                                <th style="width:32%">User</th>
                                <th style="width:28%">Email</th>
                                <th style="width:14%">Role</th>
                                <th style="width:14%">Status</th>
                                <th style="width:12%">Last login</th>
                            </tr>
                        </thead>
                        <tbody id="tbody">
                            <tr>
                                <td colspan="5" class="empty">No users to display</td>
                            </tr>
                        </tbody>
                    </table>


                </div>
                <div class="footerbar">
                    <div id="count">Showing 0 of 0 users</div>
                    <nav class="pager" aria-label="Pagination">
                        <button class="page-btn" disabled>← Previous</button>
                        <button class="page-num is-current" aria-current="page">1</button>
                        <button class="page-num" disabled>2</button>
                        <button class="page-num" disabled>3</button>
                        <button class="page-num" disabled>…</button>
                        <button class="page-num" disabled>10</button>
                        <button class="page-btn" disabled>Next →</button>
                    </nav>
                </div>

            </div>
        </section>
    </div>

    <script>
        const API_BASE = ""; 

        const tbody = document.getElementById("tbody");
        const countEl = document.getElementById("count");

        let currentPage = 1;
        const pageSize = 3;

        document.getElementById("AddUser").addEventListener("click", () => {
            location.href = "/UserAccounteditForm/UserAccounteditForm.html";
        });
        async function loadPage(page) {
            currentPage = page;

            // call API ใช้ endpoint pattern นี้
            // API_BASE/users?page=1&limit=3
            const res = await fetch(`${API_BASE}/users?page=${page}&limit=${pageSize}`);
            const data = await res.json();

            const items = data.items || [];
            const total = data.total || 0;

            renderTable(items);

            countEl.textContent = `Showing ${items.length} of ${total} users`;

            // update pagination UI
            updatePagination(total);
        }

        function renderTable(list) {
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty">No users to display</td></tr>`;
                return;
            }
            tbody.innerHTML = list.map(u => `
            <tr>
            <td><div class="avatar">${u.avatarText || '--'}</div> ${u.name || ''}</td>
            <td>${u.email || ''}</td>
            <td><span class="pill pill-role">${u.role || ''}</span></td>
            <td><span class="pill pill-${(u.status || '').toLowerCase()}">${u.status || ''}</span></td>
            <td>${u.lastLogin || ''}</td>
            </tr> 
            `).join("");
        }

        function updatePagination(total) {
            const maxPage = Math.ceil(total / pageSize);

            document.getElementById("btnPrev").disabled = currentPage <= 1;
            document.getElementById("btnNext").disabled = currentPage >= maxPage;

            document.getElementById("p1").classList.toggle("is-current", currentPage === 1);
            document.getElementById("p2").classList.toggle("is-current", currentPage === 2);
            document.getElementById("p3").classList.toggle("is-current", currentPage === 3);
            document.getElementById("p10").classList.toggle("is-current", currentPage === 10);
        }

        document.getElementById("btnPrev").onclick = () => loadPage(currentPage - 1);
        document.getElementById("btnNext").onclick = () => loadPage(currentPage + 1);
        document.getElementById("p1").onclick = () => loadPage(1);
        document.getElementById("p2").onclick = () => loadPage(2);
        document.getElementById("p3").onclick = () => loadPage(3);
        document.getElementById("p10").onclick = () => loadPage(10);
        loadPage(1);


    </script>
</body>

</html>
