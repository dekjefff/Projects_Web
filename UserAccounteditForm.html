<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Editer Tools – User Account</title>
    <link rel="stylesheet" href="/UserAccounteditForm/UserAccounteditForm.css">
</head>

<body>
    <div class="shell">
        <section class="header">
            <h1 class="header-title">Admin Editer Tools</h1>
            <div class="header-sub">User Account management</div>
        </section>

        <section class="stage">
            <form class="card" id="userForm" novalidate>

                <div class="caps" aria-label="Top identity">
                    <span class="caps-label">ID :</span>
                    <input class="pill-inp" id="userId" type="text" value="0123456789" readonly />
                    <span class="caps-label" style="margin-left:8px">Gender :</span>
                    <select class="pill-sel" id="gender">
                        <option value="M" selected>M</option>
                        <option value="F">F</option>
                        <option value="O">Other</option>
                    </select>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="firstName">First Name</label>
                        <input class="inp" id="firstName" type="text" placeholder="First Name" required />
                    </div>
                    <div class="field">
                        <label for="lastName">Last Name</label>
                        <input class="inp" id="lastName" type="text" placeholder="Last Name" required />
                    </div>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="email">Email</label>
                        <input class="inp" id="email" type="email" placeholder="Email" required />
                    </div>
                    <div class="field">
                        <label for="phone">Phone</label>
                        <input class="inp" id="phone" type="tel" placeholder="Phone" required />
                    </div>
                </div>

                <div class="field" style="margin-bottom:10px">
                    <label for="address">Shipping address</label>
                    <textarea class="ta" id="address" placeholder="address"></textarea>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="member">Membership status</label>
                        <select class="sel" id="member">
                            <option value="VIP" selected>VIP</option>
                            <option value="Gold">Gold</option>
                            <option value="Member">Member</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" id="btnCancel">Cancel</button>
                    <button type="submit" class="btn btn-save" id="btnSave">Save</button>
                </div>
            </form>
    </div>
    </section>
    </div>

    <script>
        const API_BASE = ""; 
        (function initFromQuery() {
            const q = new URLSearchParams(location.search);
            if (q.get("id")) document.getElementById("userId").value = q.get("id");
        })();

        document.getElementById("btnCancel").addEventListener("click", () => {
            location.href = "/UserManagement/UserManagement.html";
        });

        document.getElementById("userForm").addEventListener("submit", async (e) => {
            e.preventDefault(); 

            const form = e.target;
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const payload = {
                id: document.getElementById("userId").value.trim(),
                gender: document.getElementById("gender").value,
                firstName: document.getElementById("firstName").value.trim(),
                lastName: document.getElementById("lastName").value.trim(),
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                address: document.getElementById("address").value.trim(),
                membership: document.getElementById("member").value
            };

            //API 
            if (payload.id && payload.id !== "") {
                await fetch(`${API_BASE}/users/${payload.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } else {
                await fetch(`${API_BASE}/users`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            }
            location.href = "/UserManagement/UserManagement.html";
        });


    </script>
</body>

</html>
